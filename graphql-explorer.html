<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GraphQL Explorer | Structured Data Engineering Studio</title>
    <meta name="description" content="Run and test GraphQL queries in the GraphQL Explorer, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/graphql-explorer.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/graphql-explorer.html" />
    <meta property="og:title" content="GraphQL Explorer | Structured Data Engineering Studio" />
    <meta property="og:description" content="Run and test GraphQL queries in the GraphQL Explorer, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GraphQL Explorer | Structured Data Engineering Studio" />
    <meta name="twitter:description" content="Run and test GraphQL queries in the GraphQL Explorer, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/graphql-explorer.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">API Tools</div>
                    <h1 class="page-title">GraphQL Explorer</h1>
                    <p class="page-subtitle">Run GraphQL queries with variables, headers, response timing, pretty JSON
                        output, and local query history.</p>
                </div>
                <button class="btn-ghost" id="loadSampleBtn">Load Sample</button>
            </header>

            <section class="graphql-layout">
                <div class="grid">
                    <div class="card-panel">
                        <label class="form-label">GraphQL Endpoint</label>
                        <input id="graphqlEndpoint" class="form-control" value="https://countries.trevorblades.com/" />

                        <div class="editor-toolbar mt-3">
                            <strong>Query Editor</strong>
                            <button class="btn-app" id="runGraphqlBtn">Run Query</button>
                        </div>

                        <textarea id="graphqlQuery"
                            class="form-control code-input">{ countries { code name emoji capital } }</textarea>
                    </div>

                    <div class="card-panel">
                        <div class="grid grid-2">
                            <div>
                                <label class="form-label">Variables JSON</label>
                                <textarea id="graphqlVariables" class="form-control code-input">{}</textarea>
                            </div>
                            <div>
                                <label class="form-label">Headers JSON</label>
                                <textarea id="graphqlHeaders" class="form-control code-input">{}</textarea>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid">
                    <div class="card-panel">
                        <div class="response-toolbar">
                            <strong>Response</strong>
                            <button class="btn-ghost" id="copyResponseBtn">Copy JSON</button>
                        </div>
                        <div class="response-meta" id="responseMeta"></div>
                        <pre class="code-output" id="graphqlResponse">Run a query to see the response.</pre>
                    </div>

                    <div class="card-panel">
                        <div class="response-toolbar">
                            <strong>Query History</strong>
                            <button class="btn-ghost" id="clearHistoryBtn">Clear</button>
                        </div>
                        <div class="history-list" id="graphqlHistory"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/graphql-explorer.js"></script>
</body>

</html>
