<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Structured Data Engineering Studio</title>
    <meta name="description" content="A browser-based structured data engineering workspace with GraphQL explorer, JSON analytics, API playground, schema forms, workflow builder, JSON query language, API docs, validation, and browser API labs." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/" />
    <meta property="og:title" content="Structured Data Engineering Studio" />
    <meta property="og:description" content="A browser-based structured data engineering workspace with GraphQL explorer, JSON analytics, API playground, schema forms, workflow builder, JSON query language, API docs, validation, and browser API labs." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Structured Data Engineering Studio" />
    <meta name="twitter:description" content="A browser-based structured data engineering workspace with GraphQL explorer, JSON analytics, API playground, schema forms, workflow builder, JSON query language, API docs, validation, and browser API labs." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <section id="dashboardHero"></section>

            <section class="grid grid-4 my-4" id="dashboardStats"></section>

            <section class="grid grid-2">
                <div class="card-panel">
                    <div class="page-kicker">Workspace Modules</div>
                    <h2>Developer Tools</h2>
                    <div class="grid grid-2 mt-3" id="moduleCards"></div>
                </div>

                <div class="grid">
                    <div class="card-panel">
                        <div class="page-kicker">Learning Progression</div>
                        <h2>Structured Data Track</h2>
                        <div class="track-list mt-3" id="learningTrack"></div>
                    </div>

                    <div class="card-panel">
                        <div class="page-kicker">Recent Activity</div>
                        <h2>Workspace Log</h2>
                        <div id="recentActivity" class="mt-3"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
