<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Workflow Builder | Structured Data Engineering Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="description" content="Build and execute visual API workflows by passing JSON through configurable nodes in the API Workflow Builder, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/workflow-builder.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/workflow-builder.html" />
    <meta property="og:title" content="API Workflow Builder | Structured Data Engineering Studio" />
    <meta property="og:description" content="Build and execute visual API workflows by passing JSON through configurable nodes in the API Workflow Builder, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="API Workflow Builder | Structured Data Engineering Studio" />
    <meta name="twitter:description" content="Build and execute visual API workflows by passing JSON through configurable nodes in the API Workflow Builder, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/workflow-builder.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">Workflow Tools</div>
                    <h1 class="page-title">API Workflow Builder</h1>
                    <p class="page-subtitle">Build a visual Node-RED-style data workflow where JSON flows through GET,
                        Filter, Transform, Sort, Map, Limit, Display, and Export nodes.</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn-ghost" id="loadSampleWorkflowBtn">Load Sample</button>
                    <button class="btn-app" id="executeWorkflowBtn">Execute</button>
                    <button class="btn-ghost" id="saveWorkflowBtn">Save</button>
                    <button class="btn-ghost" id="exportWorkflowBtn">Export</button>
                </div>
            </header>

            <section class="workflow-layout">
                <aside class="card-panel">
                    <div class="page-kicker">Node Palette</div>
                    <h2>Add Blocks</h2>
                    <div id="nodePalette" class="node-palette mt-3"></div>
                </aside>

                <section>
                    <div id="workflowCanvas" class="workflow-canvas"></div>
                </section>

                <aside class="card-panel">
                    <div class="page-kicker">Workflow Output</div>
                    <h2>Execution Result</h2>
                    <pre id="workflowOutput" class="code-output mt-3">Execute the workflow to see node output.</pre>
                </aside>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/workflow-builder.js"></script>
</body>

</html>
