<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Data Analytics Dashboard | Structured Data Engineering Studio</title>
    <meta name="description" content="Upload, parse, filter, group, and chart JSON data in the JSON Data Analytics Dashboard, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/json-analytics.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/json-analytics.html" />
    <meta property="og:title" content="JSON Data Analytics Dashboard | Structured Data Engineering Studio" />
    <meta property="og:description" content="Upload, parse, filter, group, and chart JSON data in the JSON Data Analytics Dashboard, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSON Data Analytics Dashboard | Structured Data Engineering Studio" />
    <meta name="twitter:description" content="Upload, parse, filter, group, and chart JSON data in the JSON Data Analytics Dashboard, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/json-analytics.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">JSON Tools</div>
                    <h1 class="page-title">JSON Data Analytics Dashboard</h1>
                    <p class="page-subtitle">Upload or paste JSON data and automatically generate dynamic tables,
                        filters, statistics, charts, grouping, and CSV exports.</p>
                </div>
                <button class="btn-ghost" id="loadDemoDatasetBtn">Load Demo Dataset</button>
            </header>

            <section class="analytics-controls mb-4">
                <div class="card-panel">
                    <label class="form-label">Upload JSON File</label>
                    <input type="file" id="jsonFileInput" class="form-control" accept=".json,application/json">

                    <label class="form-label mt-3">Or Paste JSON</label>
                    <textarea id="jsonInput" class="form-control code-input"
                        placeholder='Paste array/object JSON here...'></textarea>

                    <div class="d-flex flex-wrap gap-2 mt-3">
                        <button class="btn-app" id="parseDatasetBtn">Parse Dataset</button>
                        <button class="btn-ghost" id="exportCsvBtn">Export Filtered CSV</button>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="page-kicker">Filters</div>
                    <div id="filtersPanel" class="grid mt-3"></div>
                </div>
            </section>

            <section class="analytics-summary mb-4" id="summaryPanel"></section>

            <section class="grid grid-2 mb-4">
                <div class="chart-panel">
                    <h3>Monthly Revenue</h3>
                    <canvas id="monthlyChart"></canvas>
                </div>

                <div class="chart-panel">
                    <h3>Category Share</h3>
                    <canvas id="categoryChart"></canvas>
                </div>
            </section>

            <section class="table-panel card-panel">
                <div class="d-flex flex-wrap justify-content-between gap-2 mb-3">
                    <div>
                        <div class="page-kicker">Dynamic Table</div>
                        <h2 class="mb-0">Filtered Results</h2>
                    </div>
                    <input id="tableSearch" class="form-control" style="max-width: 320px;" placeholder="Search rows...">
                </div>

                <div class="table-scroll" id="dataTablePanel"></div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/json-analytics.js"></script>
</body>

</html>
