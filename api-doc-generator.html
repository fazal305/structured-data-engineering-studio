<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Documentation Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/api-doc-generator.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">Documentation Tools</div>
                    <h1 class="page-title">API Documentation Generator</h1>
                    <p class="page-subtitle">Paste any JSON response and generate field docs, data types, examples, type
                        summary, field tree, and Markdown export.</p>
                </div>
                <button class="btn-ghost" id="loadDocsSampleBtn">Load Sample</button>
            </header>

            <section class="docs-layout">
                <div class="grid">
                    <div class="card-panel">
                        <div class="d-flex justify-content-between gap-2 mb-2">
                            <strong>JSON Response</strong>
                            <button class="btn-app" id="generateDocsBtn">Generate Docs</button>
                        </div>
                        <textarea id="docsJsonInput" class="form-control code-input"></textarea>
                    </div>

                    <div class="card-panel">
                        <div class="d-flex flex-wrap justify-content-between gap-2 mb-2">
                            <strong>Markdown Export</strong>
                            <div class="d-flex gap-2">
                                <button class="btn-ghost" id="copyMarkdownBtn">Copy</button>
                                <button class="btn-ghost" id="downloadMarkdownBtn">Download</button>
                            </div>
                        </div>
                        <pre id="markdownOutput" class="code-output">Generate documentation to see Markdown.</pre>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="page-kicker">Generated Documentation</div>
                    <h2>Field Reference</h2>
                    <div id="documentationOutput" class="mt-3"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/api-doc-generator.js"></script>
</body>

</html>
