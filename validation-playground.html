<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Validation Playground | Structured Data Engineering Studio</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="description" content="Validate JSON data against custom rule objects in the Data Validation Playground, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/validation-playground.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/validation-playground.html" />
    <meta property="og:title" content="Data Validation Playground | Structured Data Engineering Studio" />
    <meta property="og:description" content="Validate JSON data against custom rule objects in the Data Validation Playground, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Data Validation Playground | Structured Data Engineering Studio" />
    <meta name="twitter:description" content="Validate JSON data against custom rule objects in the Data Validation Playground, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/validation-playground.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">Validation Tools</div>
                    <h1 class="page-title">Data Validation Playground</h1>
                    <p class="page-subtitle">Paste JSON, define validation rules, validate required fields, types,
                        lengths, ranges, regex patterns, and export a validation report.</p>
                </div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="btn-ghost" id="loadValidationSampleBtn">Load Sample</button>
                    <button class="btn-app" id="validateDataBtn">Validate</button>
                    <button class="btn-ghost" id="exportReportBtn">Export Report</button>
                </div>
            </header>

            <section class="validation-layout">
                <div class="grid">
                    <div class="card-panel">
                        <div class="d-flex justify-content-between gap-2 mb-2">
                            <strong>JSON Data</strong>
                            <button class="btn-ghost" id="autoFixBtn">Auto-Fix Formatting</button>
                        </div>
                        <textarea id="validationJsonInput" class="form-control code-input"></textarea>
                    </div>

                    <div class="card-panel">
                        <div class="page-kicker">Validation Results</div>
                        <h2>Errors & Warnings</h2>
                        <div id="validationErrors" class="mt-3"></div>
                    </div>
                </div>

                <aside class="card-panel">
                    <div class="d-flex justify-content-between gap-2">
                        <div>
                            <div class="page-kicker">Rules</div>
                            <h2>Validation Rules</h2>
                        </div>
                        <button class="btn-app" id="addRuleBtn">Add Rule</button>
                    </div>

                    <div id="validationRules" class="mt-3"></div>
                </aside>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/validation-playground.js"></script>
</body>

</html>
