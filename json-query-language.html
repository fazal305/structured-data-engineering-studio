<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Query Language | Structured Data Engineering Studio</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" />
    <meta name="description" content="Query JSON data with a custom tokenizer, parser, and executor in the JSON Query Language module, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/json-query-language.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/json-query-language.html" />
    <meta property="og:title" content="JSON Query Language | Structured Data Engineering Studio" />
    <meta property="og:description" content="Query JSON data with a custom tokenizer, parser, and executor in the JSON Query Language module, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JSON Query Language | Structured Data Engineering Studio" />
    <meta name="twitter:description" content="Query JSON data with a custom tokenizer, parser, and executor in the JSON Query Language module, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/json-query-language.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">Query Tools</div>
                    <h1 class="page-title">JSON Query Language</h1>
                    <p class="page-subtitle">Write mini query expressions, tokenize them, parse conditions, execute
                        against JSON arrays, and render matching results.</p>
                </div>
                <button class="btn-ghost" id="loadQuerySampleBtn">Load Sample</button>
            </header>

            <section class="query-layout">
                <div class="grid">
                    <div class="card-panel">
                        <label class="form-label">JSON Dataset</label>
                        <textarea id="queryDatasetInput" class="form-control code-input"></textarea>
                    </div>

                    <div class="card-panel">
                        <label class="form-label">Query</label>
                        <input id="jsonQueryInput" class="form-control" placeholder="age > 20 AND city == Karachi">

                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <button class="btn-app" id="runJsonQueryBtn">Run Query</button>
                            <button class="btn-ghost" id="saveJsonQueryBtn">Save Query</button>
                        </div>

                        <div class="mt-3">
                            <strong>Tokens</strong>
                            <div id="tokenOutput" class="token-list mt-2"></div>
                        </div>
                    </div>

                    <div class="card-panel">
                        <div class="page-kicker">Saved Queries</div>
                        <div id="savedQueries" class="grid mt-3"></div>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="page-kicker">Results</div>
                    <h2>Matching Rows</h2>
                    <div id="queryResults" class="table-scroll mt-3"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/json-query-language.js"></script>
</body>

</html>
