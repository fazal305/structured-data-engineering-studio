<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema Form Generator | Structured Data Engineering Studio</title>
    <meta name="description" content="Generate live forms from JSON Schema definitions in the Schema Form Generator, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />
    <link rel="canonical" href="https://fazal305.github.io/structured-data-engineering-studio/schema-form-generator.html" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://fazal305.github.io/structured-data-engineering-studio/schema-form-generator.html" />
    <meta property="og:title" content="Schema Form Generator | Structured Data Engineering Studio" />
    <meta property="og:description" content="Generate live forms from JSON Schema definitions in the Schema Form Generator, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Schema Form Generator | Structured Data Engineering Studio" />
    <meta name="twitter:description" content="Generate live forms from JSON Schema definitions in the Schema Form Generator, part of the Structured Data Engineering Studio's browser-based GraphQL, JSON, and API workspace." />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/schema-form-generator.css">
</head>

<body>
    <div class="app-shell">
        <div data-sidebar></div>

        <main class="main-content">
            <header class="page-header">
                <div>
                    <div class="page-kicker">Schema Tools</div>
                    <h1 class="page-title">Schema Form Generator</h1>
                    <p class="page-subtitle">Paste JSON Schema and generate a dynamic form with required fields,
                        validation messages, and live JSON preview.</p>
                </div>
                <button class="btn-ghost" id="loadSampleSchemaBtn">Load Sample Schema</button>
            </header>

            <section class="schema-layout">
                <div class="grid">
                    <div class="card-panel">
                        <div class="d-flex justify-content-between gap-2 mb-2">
                            <strong>JSON Schema</strong>
                            <button class="btn-app" id="generateFormBtn">Generate Form</button>
                        </div>
                        <textarea id="schemaInput" class="form-control code-input"></textarea>
                    </div>

                    <div class="card-panel">
                        <strong>Form Data Preview</strong>
                        <pre id="formDataPreview" class="code-output mt-3">{}</pre>
                        <div class="d-flex flex-wrap gap-2 mt-3">
                            <button class="btn-ghost" id="copyFormDataBtn">Copy JSON</button>
                            <button class="btn-ghost" id="downloadFormDataBtn">Download JSON</button>
                        </div>
                    </div>
                </div>

                <div class="card-panel">
                    <div class="page-kicker">Generated Form</div>
                    <h2>Live Form</h2>
                    <form id="generatedForm" class="generated-form mt-3"></form>
                </div>
            </section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/schema-form-generator.js"></script>
</body>

</html>
